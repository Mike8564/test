<!doctype html>
<html lang="en">

<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#263331;background:#f6f5f1;font-size:14px;--teal:#23695d;--line:#dfE3dd;--muted:#6d7772}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}button:disabled{cursor:wait;opacity:.6}a{color:var(--teal)}.shell{display:flex;min-height:100vh}.sidebar{width:224px;flex:0 0 224px;background:#202e2c;color:#edf2ed;padding:32px 20px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0}.brand{display:flex;gap:12px;align-items:center;color:inherit;text-decoration:none;font-size:16px;font-weight:650}.brand-mark{border:1px solid #667e75;border-radius:8px;padding:10px 13px;color:#bedacc}.brand small{display:block;font-size:9px;letter-spacing:1.6px;color:#99ada5;margin-top:6px}nav{margin-top:44px;display:grid;gap:8px}nav a{display:flex;justify-content:space-between;color:#b9c7c0;text-decoration:none;padding:13px 15px;border-radius:6px}nav a span{font-size:11px;opacity:.55}nav a.active{background:#344b43;color:white}.sidebar-foot{margin-top:auto;padding:24px 10px 0;color:#c9d4ce;font-size:12px}.sidebar-foot p{line-height:1.8;color:#91a59b}.sidebar-foot a{color:#c7d9ce;text-decoration:none}.privacy-dot{display:inline-block;background:#9bbda7;width:6px;height:6px;border-radius:50%;margin-right:6px}main{margin-left:224px;min-width:0;width:calc(100% - 224px)}.topbar{height:68px;background:#fafaf7;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;font-size:12px}.local-label{color:var(--muted);font-size:11px}.page{padding:34px 32px 44px}.page-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}h1{font-size:29px;letter-spacing:-.8px;margin:0 0 10px;font-weight:620}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 10px}p{line-height:1.6}.subtext,.muted{color:var(--muted)}.s rgin-bottom:10px;box-shadow:0 2px 3px #243d2604}.card-top{display:flex;justify-content:space-between;align-items:center;font-size:10px;margin-bottom:10px;color:var(--muted)}.priority{font-size:10px;border-radius:4px;padding:3px 5px;background:#efeee7;color:#786c48}.priority-P0{background:#f7e8e2;color:#9b5145}.priority-P1{background:#f3eddd;color:#8a6d32}.card-title{display:block;border:0;background:none;padding:0;text-align:left;font-size:13px;line-height:1.5;font-weight:600;width:100%;color:inherit}.card p{font-size:11px;line-height:1.6;margin:10px 0;color:var(--muted);overflow-wrap:anywhere}.card-foot{display:flex;justify-content:space-between;align-items:center;gap:7px;border-top:1px solid #edf0e9;padding-top:11px;margin-top:12px}.owner{font-size:11px;display:flex;gap:6px;align-items:center}.avatar{height:24px;width:24px;background:#e8eee6;color:#50684f;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}.move-select{font-size:10px;padding:5px 3px;width:105px}.empty{padding:34px 22px;color:var(--muted);text-align:center;line-height:1.7}.column .empty{font-size:11px;padding:34px 8px}.badge{font-size:10px;border:1px solid #dce2d7;padding:3px 6px;border-radius:4px;color:#687662;display:inline-block}.blocked-note{color:#a05744!important}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:22px}.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.agent-heading{display:flex;align-items:center;gap:12px;margin-bottom:17px}.agent-heading .avatar{width:38px;height:38px;font-size:13px}.agent-heading h2{margin:0 0 4px}.agent-heading small{color:var(--muted)}.agent-card p{font-size:12px}.agent-details{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:16px;font-size:12px}.field-label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:7px}.note{font-size:12px;color:var(--muted);line-height:1.7}.workflow-scroll{overflow:auto;background:#fafbf8;border:1px solid var(--line);border-radius:8px}.workflow-scroll svg{display:block}.workflow-node{cursor:pointer}.workflow-node:focus rect{stroke:#23695d;stroke-width:3}.workflow-node rect{fill:#fff;stroke:#c9d4c9}.workflow-node text{fill:#304138;font-size:12px}.workflow-node .svg-small{fill:#6d7772;font-size:10px}.legend{display:flex;gap:20px;margin:18px 0;font-size:12px;color:var(--muted)}.legend b{margin-right:6px}.workflow-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:20px}.workflow-list .panel{padding:16px}.workflow-list p{font-size:12px}.task-link{border:0;background:#edf2e9;padding:6px 8px;text-align:left;border-radius:4px;margin:4px 4px 0 0;font-size:11px;color:#36523e}.channels-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px}.channel-list{display:grid;gap:7px;align-content:start}.channel-list button{text-align:left;padding:13px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#58665c}.channel-list button.active{border-color:#7d9c85;background:#e9f0e5;color:#294d36}.channel-content pre,.brief-content{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;font-size:12px;line-height:1.8;margin:16px 0}.channel-content{min-height:340px}.overlay{position:fixed;inset:0;z-index:20;background:#14231e66;display:flex;justify-content:flex-end}.overlay[hidden]{display:none}.drawer{width:620px;max-width:96vw;background:#fafaf7;overflow:auto;height:100%;box-shadow:-10px 0 50px #0002;padding:26px 30px}.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:23px}.drawer-head h2{font-size:23px;margin:8px 0}.close{font-size:22px;border:0;background:none;color:#5d6d60;padding:0 5px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form-field{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:550}.form-field.full{grid-column:1/-1}.form-field small{font-weight:400;color:var(--muted);line-height:1.6}.form-field textarea,.form-field input,.form-field select{font-size:12px;font-weight:400}.drawer-actions{position:sticky;bottom:-26px;padding:18px 0;background:#fafaf7;display:flex;gap:10px;border-top:1px solid var(--line);margin-top:24px}.drawer-section{border-top:1px solid var(--line);padding-top:20px;margin-top:22px}.drawer-section h3{font-size:13px}.evidence-row{display:flex;gap:10px;align-items:start;padding:8px 0;font-size:12px;overflow-wrap:anywhere}.evidence-row span,.evidence-row a{flex:1;min-width:0}.error{color:#944c3c;background:#f8eae4;border:1px solid #e8cfc5;border-radius:5px;padding:12px;line-height:1.6;font-size:12px}.success{color:#366048;background:#e9f1e7;border:1px solid #d2e1ce;border-radius:5px;padding:12px;font-size:12px}#notice:not(:empty){margin:16px 32px 0}.drawer-message:not(:empty){margin-bottom:16px}.blocking{background:#f4ece2;padding:10px;border-radius:4px;font-size:12px;margin-bottom:16px}.dependency-list{min-height:90px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:1000px){.sidebar{width:180px;flex-basis:180px;padding:25px 14px}main{margin-left:180px;width:calc(100% - 180px)}.page{padding:26px 22px}.topbar{padding:0 22px}.brand{font-size:14px;gap:8px}.brand-mark{padding:8px 10px}.channels-layout{grid-template-columns:170px minmax(0,1fr)}}@media(max-width:650px){.sidebar{position:static;width:100%;padding:14px 16px}.shell{display:block}.brand small,.sidebar-foot{display:none}nav{display:flex;margin-top:16px;gap:4px}nav a{flex:1;padding:10px 7px;font-size:12px}nav a span{display:none}main{margin:0;width:100%}.topbar{height:48px}.local-label{display:none}.page{padding:24px 16px}.filters{flex-wrap:wrap}.filters input{flex-basis:100%}.filters select{flex:1}.page-heading{gap:10px}h1{font-size:25px}.focus-panel{display:block}.focus-panel p{margin-top:7px}.stats{gap:13px}.channels-layout{grid-template-columns:1fr}.channel-list{display:flex;overflow:auto}.channel-list button{white-space:nowrap}.drawer{padding:22px 18px}.form-grid{gap:13px}.drawer-actions{bottom:-22px}.column{flex-basis:240px}}

.pass-color{color:#36795f}.fail-color{color:#b47758}.button-row{display:flex;gap:8px;flex-wrap:wrap}.update-entry{padding:14px;margin-bottom:10px}.top-gap{margin-top:16px}

:root { color-scheme: only light; }
body, main { background-color: #F6F5F1; color: #263331; }
.board { scrollbar-color: #23695D #EEEFE9; }
.board::-webkit-scrollbar-track { background-color: #EEEFE9; }
.board::-webkit-scrollbar-thumb { background-color: #23695D; border-radius: 6px; }
.btn:disabled { cursor: default; }
.page-heading .subtext { min-height: 1.6em; }
.focus-panel p { min-height: 3.2em; }
.drawer { position: fixed; inset: 0 0 0 auto; z-index: 20; margin: 0; border: 0; color: inherit; }
.drawer::backdrop { background: #14231e66; }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="#tasks"><span class="brand-mark">P</span><span>Mike<small>COMMAND CENTER</small></span></a>
    <nav aria-label="Main navigation">
      <a href="#tasks" class="active" aria-current="page">Tasks</a>
    </nav>
    <div class="sidebar-foot"><span class="privacy-dot"></span> Local preview</div>
  </aside>
  <main>
    <header class="topbar"><span>Mike</span><span class="local-label">Local board</span></header>
    <section id="tasks" class="page">
      <div class="page-heading">
        <div><div class="eyebrow">PROJECT OVERVIEW</div><h1>Tasks</h1><p class="subtext"></p></div>
        <div class="button-row">
          <button type="button" class="btn" id="refresh">Refresh</button>
          <button type="button" class="btn primary" id="new-task">+ New task</button>
        </div>
      </div>
      <div class="focus-panel"><span class="label">CURRENT FOCUS</span><p></p></div>
      <form class="filters" id="task-filters" autocomplete="off">
        <label class="sr-only" for="search">Search tasks</label>
        <input id="search" type="search" placeholder="Search tasks, IDs, and next actions…">
        <select id="owner-filter" aria-label="Filter by owner"><option value="">All owners</option></select>
        <select id="priority-filter" aria-label="Filter by priority"><option value="">All priorities</option><option>P0</option><option>P1</option><option>P2</option><option>P3</option></select>
      </form>
      <div class="board" id="board" aria-label="Task board" tabindex="0"></div>
      <div class="stats"><span><strong id="total-tasks">0</strong>total tasks</span><span><strong id="in-progress-tasks">0</strong>in progress</span><span><strong id="done-tasks">0</strong>done</span></div>
    </section>
  </main>
</div>

<template id="column-template">
  <section class="column">
    <div class="column-head"><span class="status-dot" aria-hidden="true"></span><span class="column-label"></span><span class="count">0</span></div>
    <div class="card empty">No tasks here</div>
  </section>
</template>

<template id="task-card-template">
  <article class="card">
    <div class="card-top"><span class="task-id"></span><span class="priority"></span></div>
    <div class="card-title"></div>
    <p class="task-next"></p>
    <p class="blocked-note" hidden></p>
    <div class="card-foot"><span class="owner"><span class="avatar" aria-hidden="true"></span><span class="task-owner"></span></span></div>
  </article>
</template>

<dialog class="drawer" id="task-drawer" aria-labelledby="drawer-title">
  <form method="dialog" autocomplete="off">
    <div class="drawer-head">
      <div><div class="eyebrow">NEW TASK</div><h2 id="drawer-title">Create a task</h2></div>
      <button class="close" aria-label="Close">×</button>
    </div>
    <div class="form-grid">
      <label class="form-field full">Title<input type="text" autofocus></label>
      <label class="form-field full">Description<textarea rows="3"></textarea></label>
      <label class="form-field">Status<select id="task-status"></select></label>
      <label class="form-field">Priority<select><option>P0</option><option>P1</option><option selected>P2</option><option>P3</option></select></label>
      <label class="form-field">Owner<select disabled><option>Unassigned</option></select></label>
      <label class="form-field">Reviewer<select disabled><option>No reviewer</option></select></label>
      <label class="form-field full">Dependencies<select class="dependency-list" multiple disabled></select></label>
      <label class="form-field full">Acceptance criteria<textarea rows="2"></textarea></label>
      <label class="form-field full">Evidence<textarea rows="3"></textarea></label>
      <label class="form-field full">Next action<textarea rows="2"></textarea></label>
      <label class="form-field full">If this fails<textarea rows="2"></textarea></label>
      <label class="form-field full">Handoff state<select><option>Not sent</option><option>Prepared</option><option>Sent</option><option>Running</option><option>Returned</option><option>Accepted</option></select></label>
    </div>
    <div class="drawer-actions">
      <button type="button" class="btn primary" disabled>Create task</button>
      <button class="btn">Cancel</button>
    </div>
    <p class="note">Layout preview. This form is cleared when closed.</p>
  </form>
</dialog>

<script>
const statuses = [
  ['backlog', 'Backlog'],
  ['in_progress', 'In progress'],
  ['review', 'Review'],
  ['regression', 'Regression'],
  ['modify', 'Modify'],
  ['blocked', 'Blocked'],
  ['done', 'Done']
];
const tasks = [
  { id: 'DEMO-01', status: 'backlog', priority: 'P2', owner: 'Alex', title: 'Draft the onboarding checklist', next: 'List the steps a new teammate needs on day one.' },
  { id: 'DEMO-02', status: 'backlog', priority: 'P3', owner: 'Jordan', title: 'Organize the icon library', next: 'Group icons by purpose and flag duplicates.' },
  { id: 'DEMO-03', status: 'in_progress', priority: 'P0', owner: 'Sam', title: 'Build the settings screen', next: 'Finish the notification preferences and check the mobile layout.' },
  { id: 'DEMO-04', status: 'in_progress', priority: 'P2', owner: 'Alex', title: 'Write empty-state copy', next: 'Draft short messages for the search and activity views.' },
  { id: 'DEMO-05', status: 'review', priority: 'P1', owner: 'Jordan', title: 'Review the navigation labels', next: 'Check that each label clearly describes its destination.' },
  { id: 'DEMO-06', status: 'regression', priority: 'P1', owner: 'Sam', title: 'Retest keyboard navigation', next: 'Verify focus order after closing the task drawer.' },
  { id: 'DEMO-07', status: 'modify', priority: 'P2', owner: 'Alex', title: 'Adjust the mobile filter layout', next: 'Check that both dropdowns fit on narrow screens.' },
  { id: 'DEMO-08', status: 'blocked', priority: 'P0', owner: 'Jordan', title: 'Capture settings screenshots', next: 'Capture both desktop and mobile views when settings are ready.', blocker: 'DEMO-03' },
  { id: 'DEMO-09', status: 'done', priority: 'P2', owner: 'Sam', title: 'Document the color palette', next: 'Color tokens are ready for the prototype.' }
];
const board = document.querySelector('#board');
const columnTemplate = document.querySelector('#column-template');
const cardTemplate = document.querySelector('#task-card-template');
const statusSelect = document.querySelector('#task-status');
const filters = document.querySelector('#task-filters');
const search = document.querySelector('#search');
const ownerFilter = document.querySelector('#owner-filter');
const priorityFilter = document.querySelector('#priority-filter');

for (const [status, label] of statuses) statusSelect.add(new Option(label, status));
for (const owner of new Set(tasks.map(task => task.owner))) ownerFilter.add(new Option(owner, owner));

function taskCard(task) {
  const card = cardTemplate.content.cloneNode(true);
  card.querySelector('.task-id').textContent = task.id;
  const priority = card.querySelector('.priority');
  priority.textContent = task.priority;
  priority.classList.add('priority-' + task.priority);
  card.querySelector('.card-title').textContent = task.title;
  card.querySelector('.task-next').textContent = task.next;
  card.querySelector('.avatar').textContent = task.owner.slice(0, 2).toUpperCase();
  card.querySelector('.task-owner').textContent = task.owner;
  if (task.blocker) {
    const note = card.querySelector('.blocked-note');
    note.textContent = 'Waiting on ' + task.blocker;
    note.hidden = false;
  }
  return card;
}

function renderBoard() {
  const query = search.value.trim().toLowerCase();
  const visibleTasks = tasks.filter(task =>
    (!ownerFilter.value || task.owner === ownerFilter.value) &&
    (!priorityFilter.value || task.priority === priorityFilter.value) &&
    [task.id, task.title, task.next].join(' ').toLowerCase().includes(query)
  );
  const scrollLeft = board.scrollLeft;
  board.replaceChildren();
  for (const [status, label] of statuses) {
    const column = columnTemplate.content.cloneNode(true);
    const section = column.querySelector('.column');
    const items = visibleTasks.filter(task => task.status === status);
    section.setAttribute('aria-label', label);
    column.querySelector('.column-label').textContent = label;
    column.querySelector('.status-dot').classList.add('status-' + status);
    column.querySelector('.count').textContent = items.length;
    if (items.length) {
      column.querySelector('.empty').remove();
      section.append(...items.map(taskCard));
    }
    board.append(column);
  }
  board.scrollLeft = scrollLeft;
}

document.querySelector('#total-tasks').textContent = tasks.length;
document.querySelector('#in-progress-tasks').textContent = tasks.filter(task => task.status === 'in_progress').length;
document.querySelector('#done-tasks').textContent = tasks.filter(task => task.status === 'done').length;

const drawer = document.querySelector('#task-drawer');
filters.addEventListener('submit', event => event.preventDefault());
search.addEventListener('input', renderBoard);
ownerFilter.addEventListener('change', renderBoard);
priorityFilter.addEventListener('change', renderBoard);
document.querySelector('#refresh').addEventListener('click', () => {
  filters.reset();
  renderBoard();
});
document.querySelector('#new-task').addEventListener('click', () => drawer.showModal());
drawer.addEventListener('close', () => drawer.querySelector('form').reset());
drawer.addEventListener('click', event => {
  const bounds = drawer.getBoundingClientRect();
  if (event.target === drawer && event.clientX < bounds.left) drawer.close();
});
renderBoard();
</script>
</body>
</html>
